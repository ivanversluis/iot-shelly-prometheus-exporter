[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelly-prometheus-exporter"
version = "0.1.0"
description = "Prometheus exporter for Shelly devices via the Shelly Cloud Control API"
requires-python = ">=3.12"
dependencies = [
    "requests~=2.32",
    "prometheus-client~=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
